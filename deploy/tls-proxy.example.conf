# On the existing host proxy, create a NEW virtual host. Keep the user-site vhost unchanged.
# Replace the hostname and certificate paths before use.
server {
    listen 80;
    server_name admin.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name admin.example.com;
    ssl_certificate /path/to/admin/fullchain.pem;
    ssl_certificate_key /path/to/admin/privkey.pem;
    client_max_body_size 250m;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
