# HTTP serves certificate challenges; credentials are submitted only over HTTPS.
server {
    listen 80;
    server_name 8.133.23.125;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://8.133.23.125$request_uri;
    }
}
